name: Sync Videos Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync playlist data
        run: python videos.py --write

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git config user.name "Shaun Roselt"
          git config user.email "Me@ShaunRoselt.com"
          git add assets/data/videos.json
          git commit -m "chore: sync videos playlist"
          git push